name: Deploy PaceMatcher

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: pacematcher-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://pacematcher.com

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Build production site
        env:
          VITE_MAPBOX_PUBLIC_TOKEN: ${{ vars.VITE_MAPBOX_PUBLIC_TOKEN }}
        run: npm run build

      - name: Validate deployment inputs
        env:
          CLOUDWAYS_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          CLOUDWAYS_USER: ${{ secrets.CLOUDWAYS_USER }}
          CLOUDWAYS_SSH_KEY: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          CLOUDWAYS_DEPLOY_PATH: ${{ secrets.CLOUDWAYS_DEPLOY_PATH }}
          CLOUDWAYS_KNOWN_HOSTS: ${{ secrets.CLOUDWAYS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail

          required_secrets=(
            CLOUDWAYS_HOST
            CLOUDWAYS_USER
            CLOUDWAYS_SSH_KEY
            CLOUDWAYS_DEPLOY_PATH
            CLOUDWAYS_KNOWN_HOSTS
          )

          for secret_name in "${required_secrets[@]}"; do
            if [[ -z "${!secret_name:-}" ]]; then
              echo "Required deployment secret is missing: $secret_name"
              exit 1
            fi
          done

          if [[ ! "$CLOUDWAYS_HOST" =~ ^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$ ]]; then
            echo "CLOUDWAYS_HOST must be a hostname or IPv4 address."
            exit 1
          fi

          if [[ ! "$CLOUDWAYS_USER" =~ ^[A-Za-z0-9._-]+$ ]]; then
            echo "CLOUDWAYS_USER contains unsupported characters."
            exit 1
          fi

          if [[ ! "$CLOUDWAYS_DEPLOY_PATH" =~ ^/[A-Za-z0-9._/-]+/public_html$ ]]; then
            echo "CLOUDWAYS_DEPLOY_PATH must be an absolute application public_html path."
            exit 1
          fi

          if [[ "/$CLOUDWAYS_DEPLOY_PATH/" == *"/../"* || "/$CLOUDWAYS_DEPLOY_PATH/" == *"/./"* ]]; then
            echo "CLOUDWAYS_DEPLOY_PATH must not contain relative path segments."
            exit 1
          fi

          if [[ ! -f dist/index.html || ! -f dist/404.html || ! -f dist/.pacematcher-deploy ]]; then
            echo "The production build or PaceMatcher ownership marker is missing."
            exit 1
          fi

          for deep_link_file in app/index.html app/tracker/index.html app/explore/index.html \
            .well-known/apple-app-site-association .well-known/apple-app-site-association.json \
            .well-known/assetlinks.json; do
            if [[ ! -s "dist/$deep_link_file" ]]; then
              echo "The build is missing $deep_link_file."
              exit 1
            fi
          done

          if [[ ! -s dist/.pacematcher-managed-paths ]]; then
            echo "The managed-path manifest is missing or empty."
            exit 1
          fi

          if [[ "$(cat dist/.pacematcher-deploy)" != "PaceMatcher Cloudways deployment marker. Keep this file in the deployed document root." ]]; then
            echo "The build contains an unexpected PaceMatcher ownership marker."
            exit 1
          fi

          while IFS= read -r managed_path; do
            if [[ -z "$managed_path" || "$managed_path" == /* || "/$managed_path/" == *"/../"* || "/$managed_path/" == *"/./"* ]]; then
              echo "Managed-path manifest contains an invalid destination: $managed_path"
              exit 1
            fi
          done < dist/.pacematcher-managed-paths

          if [[ -n "$(find dist -type l -print -quit)" ]]; then
            echo "Symbolic links are not allowed in the deployment artifact."
            exit 1
          fi

      - name: Preflight and upload static files over verified SSH
        env:
          CLOUDWAYS_HOST: ${{ secrets.CLOUDWAYS_HOST }}
          CLOUDWAYS_USER: ${{ secrets.CLOUDWAYS_USER }}
          CLOUDWAYS_SSH_KEY: ${{ secrets.CLOUDWAYS_SSH_KEY }}
          CLOUDWAYS_DEPLOY_PATH: ${{ secrets.CLOUDWAYS_DEPLOY_PATH }}
          CLOUDWAYS_KNOWN_HOSTS: ${{ secrets.CLOUDWAYS_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          umask 077

          ssh_key="$RUNNER_TEMP/cloudways_deploy_key"
          known_hosts_file="$RUNNER_TEMP/cloudways_known_hosts"

          printf '%s\n' "$CLOUDWAYS_SSH_KEY" > "$ssh_key"
          printf '%s\n' "$CLOUDWAYS_KNOWN_HOSTS" > "$known_hosts_file"
          chmod 600 "$ssh_key" "$known_hosts_file"

          if ! ssh-keygen -F "$CLOUDWAYS_HOST" -f "$known_hosts_file" >/dev/null; then
            echo "CLOUDWAYS_KNOWN_HOSTS does not contain a trusted entry for CLOUDWAYS_HOST."
            exit 1
          fi

          ssh_options=(
            -i "$ssh_key"
            -o BatchMode=yes
            -o IdentitiesOnly=yes
            -o StrictHostKeyChecking=yes
            -o "UserKnownHostsFile=$known_hosts_file"
            -o ConnectTimeout=20
          )
          remote="${CLOUDWAYS_USER}@${CLOUDWAYS_HOST}"
          printf -v quoted_deploy_path '%q' "$CLOUDWAYS_DEPLOY_PATH"
          manifest_base64="$(base64 < dist/.pacematcher-managed-paths | tr -d '\n')"
          printf -v quoted_manifest_base64 '%q' "$manifest_base64"

          ssh "${ssh_options[@]}" "$remote" \
            "bash -s -- $quoted_deploy_path $quoted_manifest_base64" \
            < scripts/cloudways-preflight.sh

          # Upload assets and event data before publishing HTML that uses them.
          rsync -az --no-perms --omit-dir-times --chmod=D755,F644 \
            --exclude=.DS_Store \
            --exclude='*.map' \
            --include='/assets/***' \
            --include='/images/***' \
            --include='/fonts/***' \
            --include='/r/' \
            --include='/r/*/' \
            --include='/r/*/event.json' \
            --include='/r/*/course.geojson' \
            --include='/privacy-policy/***' \
            --include='/terms-of-service/***' \
            --include='/favicon.svg' \
            --include='/favicon-32.png' \
            --include='/favicon-192.png' \
            --include='/apple-touch-icon.png' \
            --include='/get.php' \
            --include='/robots.txt' \
            --include='/sitemap.xml' \
            --exclude='*' \
            -e "ssh ${ssh_options[*]}" \
            dist/ "$remote:$CLOUDWAYS_DEPLOY_PATH/"

          rsync -az --no-perms --omit-dir-times --chmod=D755,F644 \
            --include='/index.html' \
            --include='/404.html' \
            --include='/app/' \
            --include='/app/index.html' \
            --include='/app/tracker/' \
            --include='/app/tracker/index.html' \
            --include='/app/explore/' \
            --include='/app/explore/index.html' \
            --include='/r/' \
            --include='/r/*/' \
            --include='/r/*/index.html' \
            --exclude='*' \
            -e "ssh ${ssh_options[*]}" \
            dist/ "$remote:$CLOUDWAYS_DEPLOY_PATH/"

          # Publish the associations after their browser fallbacks are available.
          rsync -az --no-perms --omit-dir-times --chmod=D755,F644 \
            --include='/.well-known/' \
            --include='/.well-known/apple-app-site-association' \
            --include='/.well-known/apple-app-site-association.json' \
            --include='/.well-known/assetlinks.json' \
            --exclude='*' \
            -e "ssh ${ssh_options[*]}" \
            dist/ "$remote:$CLOUDWAYS_DEPLOY_PATH/"

          ssh "${ssh_options[@]}" "$remote" "
            set -eu
            deploy_path=$quoted_deploy_path
            mv \"\$deploy_path/.pacematcher-managed-paths.stage\" \"\$deploy_path/.pacematcher-managed-paths\"
          "

      - name: Purge Cloudways application cache
        timeout-minutes: 3
        env:
          CLOUDWAYS_API_TOKEN: ${{ secrets.CLOUDWAYS_API_TOKEN }}
          CLOUDWAYS_SERVER_ID: ${{ vars.CLOUDWAYS_SERVER_ID }}
          CLOUDWAYS_APP_ID: ${{ vars.CLOUDWAYS_APP_ID }}
        run: |
          set -euo pipefail

          if [[ -z "$CLOUDWAYS_API_TOKEN" && -z "$CLOUDWAYS_SERVER_ID" && -z "$CLOUDWAYS_APP_ID" ]]; then
            echo "::warning::Cloudways application cache purge skipped because it is not configured."
            exit 0
          fi

          if [[ -z "$CLOUDWAYS_API_TOKEN" || ! "$CLOUDWAYS_SERVER_ID" =~ ^[1-9][0-9]*$ || ! "$CLOUDWAYS_APP_ID" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Set CLOUDWAYS_API_TOKEN and numeric CLOUDWAYS_SERVER_ID and CLOUDWAYS_APP_ID in the production environment."
            exit 1
          fi

          api_url=https://api.cloudways.com/api/v2
          curl_options=(
            --fail --silent --show-error --connect-timeout 5 --max-time 10
            --header "Authorization: Bearer $CLOUDWAYS_API_TOKEN"
          )
          response="$(curl "${curl_options[@]}" \
            --data-urlencode "server_id=$CLOUDWAYS_SERVER_ID" \
            --data-urlencode "app_id=$CLOUDWAYS_APP_ID" \
            "$api_url/app/cache/purge")"
          if ! operation_id="$(jq -er 'select(.status == true) | .operation_id | tostring | select(test("^(flex-)?[1-9][0-9]*$"))' <<< "$response")"; then
            echo "::error::Cloudways did not return a valid cache purge operation."
            exit 1
          fi

          for attempt in {1..12}; do
            response="$(curl "${curl_options[@]}" "$api_url/operation/$operation_id")"
            status="$(jq -er '.operation.is_completed | tostring' <<< "$response")"
            case "$status" in
              1) echo "Cloudways application cache purged."; exit 0 ;;
              -1) echo "::error::Cloudways reported a failed cache purge."; exit 1 ;;
              0) if [[ "$attempt" -lt 12 ]]; then sleep 5; fi ;;
              *) echo "::error::Cloudways returned an unexpected cache purge status."; exit 1 ;;
            esac
          done
          echo "::error::Cloudways did not confirm cache purge completion in time."
          exit 1
